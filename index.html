=====================================================================
 GUÍA RÁPIDA PARA EDITAR ESTA WEB  (todo está en el bloque CONFIG de abajo)
=====================================================================
 Buscá el bloque  "const CONFIG = {"  (más abajo, dentro del <script>).
 No hace falta tocar el HTML ni las funciones.

 • TÍTULOS Y TEXTOS ......... CONFIG.hero, CONFIG.sections.*, CONFIG.problems,
                              CONFIG.modules, CONFIG.assistant, CONFIG.languages…
 • IMÁGENES ................. CONFIG.images (rutas dentro de la carpeta img/).
                              Para cambiar una captura: reemplazá el archivo en img/
                              (o cambiá su ruta en CONFIG.images). La foto de taller del
                              banner es opcional: CONFIG.images.heroPhoto (vacía = no se muestra).
 • PROFESIONES .............. CONFIG.professions  (nombre, ícono, descripción, estado:
                              "available" = Disponible, "soon" = Próximamente,
                              "evaluating" = En evaluación).
 • PREGUNTAS Y RESPUESTAS ... CONFIG.quiz[<id de la profesión>].questions
                              Cada pregunta tiene "text", "module" y 4 opciones ordenadas de
                              menos a más organizado (valen 0, 1, 2 y 3 puntos).
 • RESULTADOS ............... CONFIG.results (textos por nivel) y CONFIG.moduleByTag
                              (qué módulos se recomiendan según la pregunta).
 • ENLACES .................. CONFIG.registrationUrl (registro), CONFIG.appUrl, CONFIG.footer.links.
 • DATOS DE CONTACTO ........ CONFIG.whatsapp.number y CONFIG.contact (si están vacíos,
                              esos botones no aparecen).
 • FORMULARIO DE DATOS ...... CONFIG.leadEndpoint (ver nota al lado). Vacío = no se envía nada.
 • COLORES Y ESTILO ......... style.css, sección "1) ZONA EDITABLE" (variables :root).

 PENDIENTES POR COMPLETAR (marcados como PENDIENTE en CONFIG):
   – URL oficial de registro, número oficial de WhatsApp, correo de contacto,
     destino seguro de los datos del formulario y fotografía de taller con licencia.
=====================================================================
-->

  const media = src ? zoomBtn(src, m.title) : `<div class="mod__shot" style="cursor:default;display:grid;place-items:center;font-size:3rem" aria-hidden="true">${m.icon}</div>`;
  return `<article class="mod glass${animate ? " reveal" : ""}"${animate ? ` id="mod-${esc(m.id)}"` : ""}>${media}<div class="mod__body"><div class="mod__top"><h3>${esc(m.title)}</h3>${badge(m.status, m.badgeNote ? `${CONFIG.statusLabels[m.status]} · ${m.badgeNote}` : "")}</div><p>${esc(m.text)}</p></div></article>`;
}

/* Estilo D: el laptop queda fijo y la pantalla cambia mientras se baja. En celular o con
   «reducir movimiento» se muestran tarjetas simples (sin efecto de scroll). */
let fxMode = null, fxHandler = null;
function renderModules() {
  const s = CONFIG.modulesSection, byId = (id) => CONFIG.modules.find((m) => m.id === id);
  const steps = s.scrollIds.map(byId).filter(Boolean), extras = s.extraIds.map(byId).filter(Boolean);
  const scrolly = innerWidth > 860 && !reduceMotion;
  fxMode = scrolly;
  if (fxHandler) { removeEventListener("scroll", fxHandler); fxHandler = null; }
  const box = $("#modulos");
  if (!scrolly) {
    box.innerHTML = `<div class="wrap">${headId(head(s, true), "modulos-title")}<div class="grid grid--3">${[...steps, ...extras].map((m) => moduleCard(m)).join("")}</div></div>`;
    return;
  }
  const PER = 62; /* alto de scroll (en vh) que dura cada paso */
  box.innerHTML = `<div class="wrap">${headId(head(s, true), "modulos-title")}</div>
    <div class="fx" id="fx" style="height:calc(${steps.length * PER}vh + 100vh)"><div class="wrap fx__sticky">
      <div class="fx__list" role="list">${steps.map((m, i) => `<button class="fx__step" type="button" role="listitem" data-i="${i}"><h3><span aria-hidden="true">${m.icon}</span>${esc(m.title)}${badge(m.status, m.badgeNote ? `${CONFIG.statusLabels[m.status]} · ${m.badgeNote}` : "")}</h3><p>${esc(m.text)}</p></button>`).join("")}</div>
      <div><div class="fx__screen"><div class="fx__frame">${steps.map((m, i) => `<img src="${esc(shot(m.shot))}" alt="${esc(m.title)}" ${i ? 'loading="lazy"' : ""} decoding="async">`).join("")}</div></div><div class="fx__dots" aria-hidden="true">${steps.map(() => "<i></i>").join("")}</div></div>
    </div></div>
    <div class="wrap"><h3 class="center" style="margin-top:50px">Y además</h3><div class="grid grid--3" style="margin-top:22px">${extras.map((m) => moduleCard(m)).join("")}</div></div>`;
  const fx = $("#fx"), items = $$(".fx__step", fx), imgs = $$(".fx__frame img", fx), dots = $$(".fx__dots i", fx);
  const total = () => fx.offsetHeight - innerHeight;
  fxHandler = () => {
    const r = fx.getBoundingClientRect(), p = Math.min(.9999, Math.max(0, -r.top / total())), k = Math.floor(p * steps.length);
    items.forEach((e, i) => e.classList.toggle("on", i === k)); imgs.forEach((e, i) => e.classList.toggle("on", i === k)); dots.forEach((e, i) => e.classList.toggle("on", i === k));
  };
  addEventListener("scroll", fxHandler, { passive: true }); fxHandler();
  $(".fx__list", fx).addEventListener("click", (e) => { const b = e.target.closest(".fx__step"); if (!b) return; const top = fx.getBoundingClientRect().top + scrollY; scrollTo({ top: top + total() * ((+b.dataset.i + .5) / steps.length), behavior: "smooth" }); });
}

    <div class="tabsx reveal" id="tabsx"><div><div class="tabsx__tabs" role="tablist">${b.steps.map((s, i) => `<button class="tabx" type="button" role="tab" data-i="${i}">${i + 1}. ${esc(s.tab || s.title)}<i></i></button>`).join("")}</div>

      <div class="tabsx__info" aria-live="polite"></div></div>
    <p class="note note--info" style="margin-top:28px">${esc(b.note)}</p></div>`;
  const root = $("#tabsx"), tabs = $$(".tabx", root), imgs = $$(".lap__frame img", root), info = $(".tabsx__info", root);
  let timer;
  const set = (i) => {
    tabs.forEach((t, j) => { t.classList.remove("on"); t.setAttribute("aria-selected", j === i); void t.offsetWidth; t.classList.toggle("on", j === i); });
    imgs.forEach((m, j) => m.classList.toggle("on", j === i));
    info.innerHTML = `<span class="eyebrow">Paso ${i + 1} de ${b.steps.length}</span><h3>${esc(b.steps[i].title)}</h3><p class="lead">${esc(b.steps[i].text)}</p>${registerBtn("btn btn--primary btn--sm")}`;
    clearTimeout(timer);
    if (!reduceMotion && !root.classList.contains("paused")) timer = setTimeout(() => set((i + 1) % b.steps.length), 6000);
    root.dataset.cur = i;
  };
  root.addEventListener("click", (e) => { const t = e.target.closest(".tabx"); if (t) set(+t.dataset.i); });
  const pause = () => { root.classList.add("paused"); clearTimeout(timer); };
  const resume = () => { root.classList.remove("paused"); set(+root.dataset.cur || 0); };
  root.addEventListener("mouseenter", pause); root.addEventListener("mouseleave", resume);
  root.addEventListener("focusin", pause); root.addEventListener("focusout", resume);
  set(0);
}

function renderHistory() {
  const h = CONFIG.history, S = CONFIG.images.shots;
  const slides = [[S.orders, "Órdenes de trabajo"], [S.cash, "Caja"], [S.purchases, "Compras"], [S.vehicles, "Vehículos"], [S.clients, "Clientes"], [S.inventory, "Repuestos y materiales"], [S.budgets, "Presupuestos"]];
  $("#historial").innerHTML = `<div class="wrap">${headId(head(h, true), "historial-title")}
    <div class="cflow reveal" id="cflow" role="region" aria-roledescription="carrusel" aria-label="Pantallas de TallerSuite"><button class="cflow__ar" style="left:8px" data-d="-1" type="button" aria-label="Anterior">‹</button><button class="cflow__ar" style="right:8px" data-d="1" type="button" aria-label="Siguiente">›</button>
      <div class="cflow__track">${slides.map(([src, cap], i) => `<button class="cflow__card" type="button" data-i="${i}" aria-label="${esc(cap)}"><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy" decoding="async"></button>`).join("")}</div><div class="cflow__cap" aria-live="polite"></div></div>
    <ul class="ticks" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:30px">${h.items.map((t) => `<li><span>${esc(t)}</span></li>`).join("")}</ul>
    <p class="note note--info">${esc(h.note)}</p></div>`;
  const box = $("#cflow"), cards = $$(".cflow__card", box), cap = $(".cflow__cap", box);
  let cur = 1, timer;
  const layout = () => {
    cards.forEach((c, i) => { const d = i - cur, a = Math.abs(d);
      c.style.transform = `translateX(${d * 52}%) translateZ(${-a * 170}px) rotateY(${-Math.sign(d) * Math.min(a, 1) * 42}deg) scale(${a ? .82 : 1})`;
      c.style.zIndex = 10 - a; c.style.opacity = a > 2 ? 0 : 1 - a * .18; c.style.filter = a ? "brightness(.9)" : "none"; c.tabIndex = a ? -1 : 0; });
    cap.textContent = slides[cur][1];
  };
  const go = (i) => { cur = (i + slides.length) % slides.length; layout(); };
  const auto = () => { clearInterval(timer); if (!reduceMotion) timer = setInterval(() => go(cur + 1), 4200); };
  box.addEventListener("click", (e) => { const b = e.target.closest(".cflow__ar"), c = e.target.closest(".cflow__card"); if (b) go(cur + +b.dataset.d); else if (c) go(+c.dataset.i); auto(); });
  box.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") go(cur - 1); if (e.key === "ArrowRight") go(cur + 1); });
  box.addEventListener("mouseenter", () => clearInterval(timer)); box.addEventListener("mouseleave", auto);
  layout(); auto();
}

/* ---- Cuestionario ---- */
const quiz = { prof: null, i: 0, answers: [] };
const area = () => $("#quiz-area");
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

function startQuiz(id) {
  quiz.prof = CONFIG.professions.find((p) => p.id === id);
  quiz.i = 0; quiz.answers = [];
  $$("#prof-grid [data-prof]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.prof === id)));
  renderQuestion(true);
}
function renderQuestion(scroll) {
  const qs = CONFIG.quiz[quiz.prof.id].questions, q = qs[quiz.i], u = CONFIG.quizUi, sel = quiz.answers[quiz.i];
  area().innerHTML = `<div class="quiz glass" id="quiz" role="group" aria-label="${esc(u.startTitle)}: ${esc(quiz.prof.name)}">
    <div class="quiz__top"><strong>${quiz.prof.icon} ${esc(quiz.prof.name)}</strong><span>${esc(fmt(u.questionOf, { n: quiz.i + 1, total: qs.length }))}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${qs.length}" aria-valuenow="${quiz.i}"><i style="width:${(quiz.i / qs.length) * 100}%"></i></div>
    <form novalidate><fieldset><legend>${esc(q.text)}</legend><div class="opts">${q.options.map((o, k) => `<div class="opt"><input type="radio" name="q" id="o${k}" value="${k}" ${sel === k ? "checked" : ""}><label for="o${k}">${esc(o)}</label></div>`).join("")}</div></fieldset>
    <p class="quiz__err" role="alert" id="qerr"></p>
    <div class="quiz__nav"><button class="btn btn--ghost" type="button" id="qprev" ${quiz.i === 0 ? "disabled" : ""}>← ${esc(u.prev)}</button><button class="btn btn--primary" type="submit" id="qnext">${quiz.i === qs.length - 1 ? esc(u.finish) : esc(u.next) + " →"}</button></div></form>
    <p style="margin:18px 0 0"><button class="btn btn--ghost btn--sm" type="button" id="qquit">${esc(u.changeProfession)}</button></p></div>`;
  requestAnimationFrame(() => { const bar = $(".progress > i"); if (bar) { bar.style.width = `${((quiz.i + (sel != null ? 1 : 0)) / qs.length) * 100}%`; } });
  $("form", area()).addEventListener("change", (e) => { if (e.target.name === "q") { quiz.answers[quiz.i] = Number(e.target.value); $("#qerr").textContent = ""; const bar = $(".progress > i"); bar.style.width = `${((quiz.i + 1) / qs.length) * 100}%`; } });
  $("form", area()).addEventListener("submit", (e) => {
    e.preventDefault();
    if (quiz.answers[quiz.i] == null) { $("#qerr").textContent = u.choose; return; }
    if (quiz.i < qs.length - 1) { quiz.i++; renderQuestion(false); } else { renderResult(); }
  });
  $("#qprev").addEventListener("click", () => { if (quiz.i > 0) { quiz.i--; renderQuestion(false); } });
  $("#qquit").addEventListener("click", () => { area().innerHTML = ""; quiz.prof = null; $$("#prof-grid [data-prof]").forEach((b) => b.setAttribute("aria-pressed", "false")); $("#profesiones").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }); });
  if (scroll) $("#quiz").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  else $("fieldset", area()).querySelector("input")?.focus({ preventScroll: true });
}

/* Resultado: diagnóstico orientativo → respuestas → oportunidades → módulos reales → datos opcionales */
function renderResult() {
  const qs = CONFIG.quiz[quiz.prof.id].questions, R = CONFIG.results, u = CONFIG.quizUi;
  const avg = quiz.answers.reduce((a, b) => a + b, 0) / qs.length;
  const level = R.levels.find((l) => avg <= l.max) || R.levels[R.levels.length - 1];
  const filled = Math.round((avg / 3) * 5);
  const low = qs.map((q, i) => ({ q, s: quiz.answers[i] })).filter((x) => x.s <= 1);
  const tags = [...new Set(low.map((x) => x.q.module))];
  const modIds = [...new Set((tags.length ? tags : ["budgets", "orders"]).flatMap((t) => CONFIG.moduleByTag[t].modules))].slice(0, 4);
  const mods = modIds.map((id) => CONFIG.modules.find((m) => m.id === id)).filter(Boolean);
  const avail = R.availability[quiz.prof.status];
  area().innerHTML = `<div class="quiz glass result" id="quiz" tabindex="-1" aria-label="Resultado">
    <div><span class="eyebrow">${quiz.prof.icon} ${esc(quiz.prof.name)}</span><h2>${esc(level.title)}</h2>
      <div class="meter" aria-hidden="true">${[0, 1, 2, 3, 4].map((n) => `<i class="${n < filled ? "on" : ""}"></i>`).join("")}</div>
      <p class="lead">${esc(level.text)}</p><p class="hero__note">${esc(R.disclaimer)}</p>
      <p class="note ${quiz.prof.status === "available" ? "note--info" : ""}"><strong>${badge(quiz.prof.status)}</strong> ${esc(avail)}</p></div>
    <div><h3>${esc(R.answersTitle)}</h3><ul class="answers">${qs.map((q, i) => { const s = quiz.answers[i]; return `<li><span>${esc(q.text)}<small>${esc(q.options[s])}</small></span><span class="tag ${s <= 1 ? "tag--low" : s === 2 ? "tag--mid" : "tag--high"}">${esc(CONFIG.scoreTags[s])}</span></li>`; }).join("")}</ul></div>
    <div><h3>${esc(R.opportunitiesTitle)}</h3>${tags.length ? ticks(tags.map((t) => CONFIG.moduleByTag[t].label)) : `<p>${esc(R.noOpportunities)}</p>`}</div>
    <div><h3>${esc(R.modulesTitle)}</h3><div class="reco">${mods.map((m) => moduleCard(m, false)).join("")}</div></div>
    ${leadFormHtml()}
    <div class="hero__cta">${registerBtn()}${whatsappBtn()}<button class="btn btn--ghost" type="button" id="qrestart">${esc(u.restart)}</button></div></div>`;
  $("#quiz").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  $("#quiz").focus({ preventScroll: true });
  $("#qrestart").addEventListener("click", () => startQuiz(quiz.prof.id));
  bindLeadForm(Math.round(avg * 10) / 10);
}

/* ---- Datos opcionales (solo se envían con consentimiento y si hay leadEndpoint) ---- */
function leadFormHtml() {
  const L = CONFIG.lead;
  return `<form class="lead-form glass" id="lead" novalidate><h3 style="margin:0">${esc(L.title)}</h3><p style="margin:0;color:var(--muted)">${esc(L.text)}</p>
    <div class="field"><label for="lname">Nombre (opcional)</label><input type="text" id="lname" autocomplete="name" maxlength="80"></div>
    <div class="field"><label for="lwa">WhatsApp (opcional)</label><input type="tel" id="lwa" autocomplete="tel" inputmode="tel" maxlength="30"></div>
    <label class="consent"><input type="checkbox" id="lconsent"><span>${esc(L.consent)} <em>${esc(L.use)}</em></span></label>
    <button class="btn btn--ghost" type="submit">${esc(L.submit)}</button><p class="form-msg" id="lmsg" role="status"></p></form>`;
}
function bindLeadForm(level) {
  const L = CONFIG.lead, msg = $("#lmsg");
  $("#lead").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("#lname").value.trim(), wa = $("#lwa").value.trim();
    if (!name && !wa) { msg.textContent = L.needData; return; }
    if (!$("#lconsent").checked) { msg.textContent = L.needConsent; return; }
    if (!CONFIG.leadEndpoint) { msg.textContent = L.notConnected; return; }   // no se simula un envío exitoso
    try {
      const r = await fetch(CONFIG.leadEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, whatsapp: wa, profession: quiz.prof.id, level, consent: true }) });
      if (!r.ok) throw new Error(r.status);
      msg.textContent = L.sent; $("#lead").reset();
    } catch { msg.textContent = L.failed; }
  });
}

/* ---- Ampliar capturas ---- */
function initLightbox() {
  const dlg = $("#lightbox"), img = $("#lightbox-img"), cap = $("#lightbox-cap");
  document.addEventListener("click", (e) => {
    const z = e.target.closest("[data-zoom]");
    if (z) { img.src = z.dataset.zoom; img.alt = z.dataset.cap; cap.textContent = z.dataset.cap; dlg.showModal(); return; }
    if (e.target === dlg || e.target.closest(".lightbox__close")) dlg.close();
  });
}

/* ---- Aparición progresiva ---- */
function initReveal() {
  const els = $$(".reveal");
  if (reduceMotion || !("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
  const io = new IntersectionObserver((en) => en.forEach((x) => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .12, rootMargin: "0px 0px -40px 0px" });
  els.forEach((e) => io.observe(e));
}

/* ---- Inclinación 3D con el mouse (portada y tarjetas con data-tilt) ---- */
function initTilt() {
  if (reduceMotion || !matchMedia("(hover: hover)").matches) return;
  const stack = $("#stack"), stage = $("#stage");
  if (stack && stage) {
    stack.addEventListener("pointermove", (e) => { const r = stack.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; stage.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 10}deg)`; });
    stack.addEventListener("pointerleave", () => { stage.style.transform = ""; });
  }
  $$("[data-tilt]").forEach((el) => {
    const m = +el.dataset.tilt || 6;
    el.addEventListener("pointermove", (e) => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; el.style.transform = `perspective(900px) rotateY(${x * m * 2}deg) rotateX(${-y * m * 2}deg) scale(1.02)`; });
    el.addEventListener("pointerleave", () => { el.style.transform = ""; });
  });
}

/* ---- Parallax del mosaico: cada tarjeta se mueve a distinta velocidad al hacer scroll ---- */
function initParallax() {
  if (reduceMotion) return;
  const boxes = $$(".mosaic");
  const run = () => boxes.forEach((b) => { const r = b.getBoundingClientRect(); if (r.bottom < -200 || r.top > innerHeight + 200) return; const m = r.top + r.height / 2 - innerHeight / 2; $$(".c", b).forEach((c) => { c.style.translate = `0 ${m * (+c.dataset.s) * -1}px`; }); });
  addEventListener("scroll", run, { passive: true }); run();
}

/* ---- Arranque ---- */
function init() {
  renderHeader(); renderHero(); renderAudience(); renderProblems(); renderModules(); renderClients(); renderBudgets(); renderTracking();
  renderHistory(); renderAssistant(); renderLanguages(); renderProfessions(); renderRegister();
  initLightbox(); initReveal(); initTilt(); initParallax(); renderWhatsappFloat();
  /* Si cambia el ancho de pantalla, se vuelve a elegir el modo de la sección de funciones */
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if ((innerWidth > 860 && !reduceMotion) !== fxMode) { renderModules(); initReveal(); } }, 250); });
}
init();
